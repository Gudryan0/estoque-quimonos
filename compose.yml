services:
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    container_name: estoque_app1
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - estoque_network

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    container_name: estoque_app2
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - estoque_network

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    container_name: estoque_app3
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - estoque_network

  mysql:
    image: mysql:8.4
    container_name: estoque_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-estoque_quimonos}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-laravel}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - estoque_network

  nginx:
    image: nginx:alpine
    container_name: estoque_nginx
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app1
      - app2
      - app3

    networks:
      - estoque_network

networks:
  estoque_network:

volumes:
  mysql_data:
